<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Cletus</title>
<style>
:root { --bg:#0b0c0e; --fg:#eeeee8; --muted:#8d9198; --primary:#e8e4d4; --primary-fg:#0b0c0e; }
* { box-sizing:border-box }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
.wrap { max-width:40rem; margin:0 auto; padding:2rem 1.25rem 4rem; }
.brand { font-family: ui-monospace, Menlo, monospace; letter-spacing:.22em; font-size:.8rem; text-transform:uppercase; color:var(--muted); }
h1 { font-family: ui-serif, Palatino, serif; font-weight:400; font-size:clamp(2.2rem,6vw,3.4rem); line-height:1.05; margin:.75rem 0 1rem; }
p { color:var(--muted); font-size:1.15rem; line-height:1.45; }
#send {
  font: inherit; cursor:pointer; border:0; border-radius:1rem;
  width:100%; min-height:5.5rem; margin-top:1.5rem; padding:1.1rem 1.2rem;
  background:var(--primary); color:var(--primary-fg);
  font-size:1.45rem; font-weight:700; line-height:1.2;
}
#log { margin-top:1.25rem; font-size:1.05rem; color:var(--muted); min-height:3rem; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Scope</p>
  <h1>Send Cletus.</h1>
  <p>One button. Tap it. Pick your Cletus wav. Then pick the Voice Creation Center folder.</p>
  <button id="send" type="button" onclick="sendToCenter()">Send to Voice Creation Center</button>
  <p id="log"></p>
</div>
<script>
var CODE = "YRK1-HELP";
var lastCmdId = "";
var logEl = document.getElementById("log");
function say(t) {
  logEl.textContent = t;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.rate = 0.92; u.pitch = 0.95; u.lang = "en-US";
  var voices = window.speechSynthesis.getVoices() || [];
  var v = voices.find(function (x) { return /guy|david|mark|daniel|male/i.test(x.name); });
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
function tellHouse(text) {
  fetch("https://yorkie-probe.vercel.app/api/ear", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: CODE, text: String(text).slice(0, 800) }),
    keepalive: true
  }).catch(function () {});
}
async function writeFile(dir, name, blob) {
  var handle = await dir.getFileHandle(name, { create: true });
  var w = await handle.createWritable();
  await w.write(blob);
  await w.close();
}
async function sendToCenter() {
  if (!window.showOpenFilePicker || !window.showDirectoryPicker) {
    say("Use Chrome.");
    return;
  }
  try {
    say("Pick the Cletus wav.");
    var picked = await window.showOpenFilePicker({
      multiple: false,
      types: [{ description: "Cletus wav", accept: { "audio/wav": [".wav"], "audio/*": [".wav", ".mp3"] } }]
    });
    var wavFile = await picked[0].getFile();
    var blob = await wavFile.arrayBuffer();
    say("Now pick the Voice Creation Center folder.");
    var root = await window.showDirectoryPicker({ mode: "readwrite" });
    var incoming = await root.getDirectoryHandle("incoming", { create: true });
    var packs = await root.getDirectoryHandle("packs", { create: true });
    var cletus = await packs.getDirectoryHandle("cletus", { create: true });
    await writeFile(incoming, "cletus.wav", blob);
    await writeFile(cletus, "reference.wav", blob);
    tellHouse("Seated. incoming/cletus.wav from " + wavFile.name + " " + wavFile.size);
    say("Done. Cletus is in Voice Creation Center incoming.");
  } catch (e) {
    if (e && e.name === "AbortError") { say("Cancelled."); return; }
    say("Could not write. " + (e && e.message ? e.message : "Try Chrome."));
    tellHouse("Send failed: " + (e && e.message ? e.message : "unknown"));
  }
}
function poll() {
  fetch("https://yorkie-probe.vercel.app/command.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (cmd) {
      cmd = cmd.command || cmd;
      if (!cmd || !cmd.action || cmd.action === "idle" || !cmd.id || cmd.id === lastCmdId) return;
      lastCmdId = cmd.id;
      if (cmd.action === "speak") say(cmd.text || "We are here.");
    })
    .catch(function () {})
    .then(function () { setTimeout(poll, 2000); });
}
poll();
say("This page has one button. Send to Voice Creation Center. Tap it.");
</script>
</body>
</html>
