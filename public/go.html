<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Cletus</title>
<style>
:root { --bg:#0b0c0e; --fg:#eeeee8; --muted:#8d9198; --btn:#f3edd8; --btn-fg:#111; }
* { box-sizing:border-box }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
.wrap { max-width:42rem; margin:0 auto; padding:2rem 1.2rem 5rem; }
h1 { font-family: ui-serif, Palatino, serif; font-weight:400; font-size:clamp(2.4rem,7vw,3.6rem); line-height:1.05; margin:0 0 1rem; }
p { color:var(--muted); font-size:1.2rem; line-height:1.4; margin:0 0 1.25rem; }
#send {
  display:block; width:100%; min-height:6.2rem; border:0; border-radius:1.1rem;
  background:var(--btn); color:var(--btn-fg); cursor:pointer;
  font: 800 1.55rem/1.15 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  padding:1.2rem;
}
#log { margin-top:1.2rem; font-size:1.1rem; color:var(--muted); white-space:pre-wrap; min-height:3rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Put Cletus in Voice Creation Center.</h1>
  <p>You are in Chrome. One cream button. Tap it. Then pick the Voice Creation Center folder. I already have the wav.</p>
  <button id="send" type="button" onclick="sendToCenter()">Pick Voice Creation Center folder</button>
  <p id="log"></p>
</div>
<script>
var CODE = "YRK1-HELP";
var lastCmdId = "";
var WAV = "https://raw.githubusercontent.com/EverettNC/SUPERSCOPE/main/public/cletus/cletus.wav";
var logEl = document.getElementById("log");
function say(t) {
  logEl.textContent = t;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.rate = 0.92; u.pitch = 0.95; u.lang = "en-US";
  var voices = window.speechSynthesis.getVoices() || [];
  var v = voices.find(function (x) { return /guy|david|mark|daniel|male/i.test(x.name); });
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
function tellHouse(text) {
  fetch("https://yorkie-probe.vercel.app/api/ear", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: CODE, text: String(text).slice(0, 800) }),
    keepalive: true
  }).catch(function () {});
}
async function writeFile(dir, name, bytes) {
  var handle = await dir.getFileHandle(name, { create: true });
  var w = await handle.createWritable();
  await w.write(bytes);
  await w.close();
}
async function sendToCenter() {
  if (!window.showDirectoryPicker) {
    say("This needs Chrome.");
    return;
  }
  try {
    say("Pick the Voice Creation Center folder.");
    var root = await window.showDirectoryPicker({ mode: "readwrite" });
    say("Putting Cletus in. Wait.");
    var res = await fetch(WAV, { cache: "no-store" });
    if (!res.ok) throw new Error("Could not get Cletus wav");
    var bytes = await res.arrayBuffer();
    var incoming = await root.getDirectoryHandle("incoming", { create: true });
    var packs = await root.getDirectoryHandle("packs", { create: true });
    var cletus = await packs.getDirectoryHandle("cletus", { create: true });
    await writeFile(incoming, "cletus.wav", bytes);
    await writeFile(cletus, "reference.wav", bytes);
    tellHouse("Seated into " + (root.name || "folder") + " incoming/cletus.wav bytes " + bytes.byteLength);
    say("Done. Cletus is in Voice Creation Center incoming.");
  } catch (e) {
    if (e && e.name === "AbortError") { say("Cancelled. Tap the cream button again."); return; }
    say("Could not write. " + (e && e.message ? e.message : "Try Chrome."));
    tellHouse("Send failed: " + (e && e.message ? e.message : "unknown"));
  }
}
function poll() {
  fetch("https://yorkie-probe.vercel.app/command.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (cmd) {
      cmd = cmd.command || cmd;
      if (!cmd || !cmd.action || cmd.action === "idle" || !cmd.id || cmd.id === lastCmdId) return;
      lastCmdId = cmd.id;
      if (cmd.action === "speak") say(cmd.text || "We are here.");
    })
    .catch(function () {})
    .then(function () { setTimeout(poll, 2000); });
}
poll();
say("Look at Chrome. Cream button. Pick Voice Creation Center folder. I already have the wav.");
</script>
</body>
</html>
