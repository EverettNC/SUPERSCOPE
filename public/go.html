<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Cletus</title>
<style>
:root { --bg:#0b0c0e; --fg:#eeeee8; --muted:#8d9198; --btn:#f3edd8; --btn-fg:#111; }
* { box-sizing:border-box }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
.wrap { max-width:40rem; margin:0 auto; padding:2rem 1.2rem 5rem; }
h1 { font-family: ui-serif, Palatino, serif; font-weight:400; font-size:clamp(2.4rem,7vw,3.4rem); line-height:1.05; margin:0 0 1rem; }
p { color:var(--muted); font-size:1.2rem; line-height:1.45; }
#play {
  display:block; width:100%; min-height:6rem; margin-top:1.4rem; border:0; border-radius:1.1rem;
  background:var(--btn); color:var(--btn-fg); cursor:pointer;
  font: 800 1.7rem/1.1 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
}
#log { margin-top:1.2rem; color:var(--muted); min-height:3rem; white-space:pre-wrap; }
audio { width:100%; margin-top:1rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cletus is here.</h1>
  <p>Do not open Voice Creation. Stay on this page. Tap Play Cletus.</p>
  <audio id="player" preload="auto" src="https://raw.githubusercontent.com/EverettNC/SUPERSCOPE/main/public/cletus/cletus.wav"></audio>
  <button id="play" type="button" onclick="playCletus()">Play Cletus</button>
  <p id="log"></p>
</div>
<script>
var CODE = "YRK1-HELP";
var lastCmdId = "";
var logEl = document.getElementById("log");
function say(t) {
  logEl.textContent = t;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.rate = 0.92; u.pitch = 0.95; u.lang = "en-US";
  var voices = window.speechSynthesis.getVoices() || [];
  var v = voices.find(function (x) { return /guy|david|mark|daniel|male/i.test(x.name); });
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
function tellHouse(text) {
  fetch("https://yorkie-probe.vercel.app/api/ear", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: CODE, text: String(text).slice(0, 800) }),
    keepalive: true
  }).catch(function () {});
}
function playCletus() {
  var a = document.getElementById("player");
  var b = document.getElementById("play");
  if (!a) return;
  if (a.paused) {
    a.play().then(function () { b.textContent = "Pause Cletus"; tellHouse("Playing Cletus"); }).catch(function () {
      say("Tap Play Cletus again.");
    });
  } else {
    a.pause();
    b.textContent = "Play Cletus";
  }
}
function startEar() {
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) return;
  var rec = new Rec();
  rec.lang = "en-US";
  rec.continuous = true;
  rec.interimResults = false;
  rec.onresult = function (ev) {
    var said = String(ev.results[ev.results.length - 1][0].transcript || "").trim();
    if (said) tellHouse(said);
  };
  rec.onend = function () { try { rec.start(); } catch (e) {} };
  try { rec.start(); } catch (e) {}
}
function poll() {
  fetch("https://yorkie-probe.vercel.app/command.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (cmd) {
      cmd = cmd.command || cmd;
      if (!cmd || !cmd.action || cmd.action === "idle" || !cmd.id || cmd.id === lastCmdId) return;
      lastCmdId = cmd.id;
      if (cmd.action === "speak") say(cmd.text || "We are here.");
      if (cmd.action === "play-cletus") playCletus();
    })
    .catch(function () {})
    .then(function () { setTimeout(poll, 2000); });
}
poll();
say("Do not open Voice Creation. Stay here. Tap Play Cletus.");
</script>
</body>
</html>
